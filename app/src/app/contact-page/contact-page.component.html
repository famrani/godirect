<app-platform-layout><main class="contact-page"><header><p>GoDirect · All Digital Network</p><h1>{{t('title')}}</h1><p>{{t('intro')}}</p></header><div class="contact-grid"><aside><h2>{{t('email')}}</h2><a [href]="'mailto:'+email">{{email}}</a><h2>{{t('phone')}}</h2><a [href]="'tel:'+phone">+33 6 85 26 65 10</a></aside><section><p>{{t('required')}}</p><form #contactForm="ngForm" (ngSubmit)="submit(contactForm)"><fieldset [disabled]="busy"><label for="contact-name">{{t('name')}}</label><input id="contact-name" name="name" [(ngModel)]="form.name" required minlength="2" maxlength="100" autocomplete="name"><label for="contact-email">{{t('yourEmail')}}</label><input id="contact-email" name="email" [(ngModel)]="form.email" type="email" email required maxlength="254" autocomplete="email"><label for="contact-topic">{{t('topic')}}</label><select id="contact-topic" name="topic" [(ngModel)]="form.topic" required><option value="general">{{t('general')}}</option><option value="listing">{{t('listing')}}</option><option value="payment">{{t('payment')}}</option></select><label for="contact-message">{{t('message')}}</label><textarea id="contact-message" name="message" [(ngModel)]="form.message" required maxlength="5000" rows="8"></textarea><div class="contact-trap" aria-hidden="true"><label>Website<input name="website" [(ngModel)]="form.website" tabindex="-1" autocomplete="off"></label></div><p class="privacy">{{t('privacy')}}</p><button type="submit" [disabled]="contactForm.invalid || busy">{{t(busy?'sending':'send')}}</button></fieldset></form><p class="success" *ngIf="sent" role="status">{{t('success')}}</p><p class="error" *ngIf="error" role="alert">{{t(error)}}</p></section></div></main></app-platform-layout>
