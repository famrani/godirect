<section class="profile-roles" aria-labelledby="profile-role-title"><header><h2 id="profile-role-title">{{t('profileRoles')}}</h2><button type="button" (click)="refresh()" [disabled]="loading">{{t('refresh')}}</button></header><p *ngIf="loading" role="status">{{t('loading')}}</p><p *ngIf="error" role="alert">{{t('error')}}</p><ng-container *ngIf="!loading && access.authenticatedUid===uid && roles.length"><p class="primary-role">{{t('primaryRole')}} : <strong>{{label(primaryRole)}}</strong></p><ul><li *ngFor="let role of roles" [class.primary]="role===primaryRole">{{label(role)}}</li></ul><p class="role-help">{{t('roleHelp')}}</p></ng-container></section>
