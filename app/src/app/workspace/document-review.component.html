<app-platform-layout><main class="document-shell"><a routerLink="/platform/admin">← GoDirect</a><h1>{{t('adminTitle')}}</h1><p>{{t('reviewIntro')}}</p><p *ngIf="error" role="alert">{{error}}</p><p class="notice">{{t('blocked')}}</p><ng-container *ngIf="data"><label>{{t('status')}}<select [(ngModel)]="filter"><option value="all">{{t('all')}}</option><option *ngFor="let s of ['pendingReview','draft','validated','refused','expiredDossier']" [value]="s">{{t('status_'+s)}}</option></select></label><label>{{t('search')}}<input [(ngModel)]="query"></label><section *ngFor="let r of rows"><h2>{{r.name}}</h2><p>{{t('owner')}} : {{r.ownerName}}</p><p>{{t('status_'+r.status)}} · {{r.validated}} / {{r.total}}</p><p *ngIf="r.reason">{{r.reason}}</p><a [routerLink]="['/platform/admin/documents',r.assetType,r.id]">{{t('open')}}</a></section><p *ngIf="!rows.length">{{t('noAssets')}}</p></ng-container></main></app-platform-layout>
